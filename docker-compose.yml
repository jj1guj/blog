# Madblog + GoatCounter 自宅サーバー構成
# 使い方は README.md を参照してください。

services:
  # ブログ本体。Fediverse のサーバーも兼ねる（@blog@ブログのドメイン）
  madblog:
    image: quay.io/blacklight/madblog:latest
    restart: unless-stopped
    environment:
      MADBLOG_LINK: https://${BLOG_DOMAIN}
      MADBLOG_ENABLE_ACTIVITYPUB: "1"
      MADBLOG_ACTIVITYPUB_USERNAME: ${FEDI_USERNAME:-blog}
      TZ: ${TZ:-Asia/Tokyo}
    volumes:
      - ./config.yaml:/etc/madblog/config.yaml:ro
      # 記事（markdown/）・画像（img/）・Fediverse の状態と鍵（.madblog/）
      - ./data:/data
    configs:
      # 閲覧数の計測と表示（Madblog の同名ファイルを置き換える）
      - source: goatcounter_js
        target: /data/js/pwabuilder-sw-register.js
    ports:
      # cloudflared の転送先（blog）: http://localhost:28080
      - "127.0.0.1:${BLOG_PORT:-28080}:8000"

  # 閲覧数カウント
  goatcounter:
    image: arp242/goatcounter:latest
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Tokyo}
    volumes:
      - gc_data:/home/goatcounter/goatcounter-data
    ports:
      # cloudflared の転送先（stats）: http://localhost:28081
      - "127.0.0.1:${STATS_PORT:-28081}:8080"

volumes:
  gc_data:

configs:
  goatcounter_js:
    content: |
      // Madblog の pwabuilder-sw-register.js を置き換えるファイル。
      // 元の PWA 登録処理に、GoatCounter の計測と閲覧数の表示を足している。
      const STATS = 'https://${STATS_DOMAIN}';

      // 元の処理（PWA の更新通知）。読み込めなくても下の処理は止めない
      import('https://cdn.jsdelivr.net/npm/@pwabuilder/pwaupdate')
        .then(() => document.body.appendChild(document.createElement('pwa-update')))
        .catch(() => {});

      // 閲覧数の計測
      const gc = document.createElement('script');
      gc.async = true;
      gc.src = STATS + '/count.js';
      gc.dataset.goatcounter = STATS + '/count';
      document.head.appendChild(gc);

      // 記事ページなら、本文の下に閲覧数を表示
      const body = document.querySelector('article .e-content');
      if (body) {
        const box = document.createElement('div');
        box.className = 'view-count';
        box.title = '閲覧数';
        box.style.cssText = 'margin:1.5em 0 .5em;opacity:.75;font-size:.95em';
        box.textContent = '👁 -';
        body.after(box);
        fetch(STATS + '/counter/' + encodeURIComponent(location.pathname) + '.json')
          .then(r => r.ok ? r.json() : { count: '0' })
          .then(d => { box.textContent = '👁 ' + d.count; })
          .catch(() => { box.textContent = '👁 0'; });
      }
