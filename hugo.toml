baseURL = 'https://example.org/'
locale = 'ja-jp'
title = 'JJ1GUJのブログ'
theme = 'PaperMod'
defaultContentLanguage = 'ja'
[taxonomies]
  category = 'categories'
  tag = 'tags'
# Hollo の /tags/ と重ならないよう、タグのページは /topics/ に出力する。
[permalinks.taxonomy]
  tags = '/topics/'
[permalinks.term]
  tags = '/topics/:slug/'
[markup]
  [markup.goldmark]
    [markup.goldmark.parser]
      wrapStandAloneImageWithinParagraph = false
      [markup.goldmark.parser.attribute]
        block = true
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)'], ['$', '$']]
[markup.highlight]
  noClasses = true
  style = 'monokai'
# URL プレビュー（SUMMARY_PROXY_URL）の取得結果を 1 週間ごとに取り直す。
[caches.getresource]
  maxAge = '168h'
[params]
  # 自動判定だと、公開記事がない状態で起動したときにトップの一覧が空のままになる。
  mainSections = ['posts']
  ShowToc = true
  TocOpen = true
