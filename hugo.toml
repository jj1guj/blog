baseURL = 'https://example.org/'
locale = 'ja-jp'
title = 'JJ1GUJのブログ'
theme = 'PaperMod'
[taxonomies]
  category = 'categories'
  tag = 'topics'
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)'], ['$', '$']]
[params]
  math = true
  ShowToc = true
  TocOpen = true
